<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#bg)" />
  <!-- magnifier: the "watch / search" mark -->
  <circle cx="21" cy="21" r="8.5" fill="none" stroke="#ffffff" stroke-width="3" />
  <line x1="27.2" y1="27.2" x2="34" y2="34" stroke="#ffffff" stroke-width="3.6"
        stroke-linecap="round" />
  <!-- "new offer" alert dot -->
  <circle cx="32.5" cy="14" r="4.6" fill="#fbbf24" stroke="url(#bg)" stroke-width="2" />
</svg>
